<!-- BEGIN: Testimonios Section -->
<section class="py-24 bg-brand-gray" id="testimonios">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div data-section-heading></div>
    <div class="flex items-center gap-4">
      <button id="testimonial-prev" aria-label="Testimonio anterior"
        class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-gray-500 hover:text-brand-dark hover:bg-gray-50">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div id="testimonials-track" class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1"></div>
      <button id="testimonial-next" aria-label="Siguiente testimonio"
        class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-gray-500 hover:text-brand-dark hover:bg-gray-50">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
    <div id="testimonial-dots" class="flex justify-center gap-2 mt-8" role="tablist"
      aria-label="Páginas de testimonios">
      <div class="w-2 h-2 rounded-full bg-brand-green" role="tab" tabindex="0" aria-label="Página 1"></div>
      <div class="w-2 h-2 rounded-full bg-gray-300" role="tab" tabindex="0" aria-label="Página 2"></div>
      <div class="w-2 h-2 rounded-full bg-gray-300" role="tab" tabindex="0" aria-label="Página 3"></div>
      <div class="w-2 h-2 rounded-full bg-gray-300" role="tab" tabindex="0" aria-label="Página 4"></div>
    </div>
  </div>
