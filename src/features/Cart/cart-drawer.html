<!-- BEGIN: Cart Drawer Component -->
<aside id="cart-drawer-root" aria-label="Carrito de compras" aria-hidden="true"
  class="fixed inset-0 z-[100] pointer-events-none transition-all duration-300">
  
  <!-- Backdrop Overlay -->
  <div data-cart-backdrop
    class="cart-backdrop absolute inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm opacity-0 transition-opacity duration-300 cursor-pointer">
  </div>

  <!-- Sliding Drawer Panel -->
  <div data-cart-panel
    class="cart-panel absolute top-0 right-0 bottom-0 w-full sm:max-w-md bg-white dark:bg-[#141416] border-l border-slate-200 dark:border-white/10 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-out z-10">
    
    <!-- Drawer Header -->
    <div class="px-6 py-5 border-b border-slate-200 dark:border-white/10 flex items-center justify-between bg-slate-50 dark:bg-black/50 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-slate-200 dark:bg-white/10 flex items-center justify-center text-slate-900 dark:text-white transition-colors">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="text-slate-950 dark:text-white font-bold text-lg tracking-wide flex items-center gap-2">
            Tu Carrito
            <span data-drawer-count-badge class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-white/10 text-slate-700 dark:text-gray-300 transition-colors">
              0 prendas
            </span>
          </h2>
        </div>
      </div>
      <button type="button" data-cart-close aria-label="Cerrar carrito"
        class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-slate-200 dark:hover:bg-white/10 active:scale-95 transition-all">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Free Shipping Progress Bar ($250.000 COP) -->
    <div data-shipping-bar-container class="px-6 py-3.5 bg-slate-100 dark:bg-[#18181b] border-b border-slate-200 dark:border-white/10 transition-colors">
      <div class="flex items-center justify-between text-xs mb-2">
        <span data-shipping-bar-message class="font-medium text-slate-700 dark:text-neutral-300">
          ¡Te faltan $250.000 COP para tener ENVÍO GRATIS!
        </span>
        <span data-shipping-bar-percent class="text-[11px] font-bold text-slate-500 dark:text-neutral-400">0%</span>
      </div>
      <div class="w-full h-2 bg-slate-200 dark:bg-white/10 rounded-full overflow-hidden transition-colors">
        <div data-shipping-bar-fill class="h-full bg-amber-500 dark:bg-amber-400 rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Drawer Body (Items list or Empty State) -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4 cart-scroll" data-cart-body>
      <!-- Contenido inyectado dinámicamente -->
    </div>

    <!-- Drawer Footer (Subtotal, Shipping & Checkout CTA) -->
    <div class="p-6 border-t border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black/70 space-y-4 transition-colors" data-cart-footer>
      <!-- Subtotal Breakdown -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-sm text-slate-600 dark:text-gray-400">
          <span>Subtotal</span>
          <span class="text-slate-900 dark:text-white font-semibold" data-drawer-subtotal>$0 COP</span>
        </div>
        <div class="flex justify-between items-center text-sm text-slate-600 dark:text-gray-400">
          <span class="flex items-center gap-1.5 text-slate-700 dark:text-gray-300">
            <i data-lucide="truck" class="w-4 h-4 text-slate-500 dark:text-neutral-400"></i>
            Envío nacional
          </span>
          <span class="text-slate-800 dark:text-neutral-300 font-semibold text-xs uppercase tracking-wider">¡Gratis a toda Colombia!</span>
        </div>
        <div class="pt-2 border-t border-slate-200 dark:border-white/10 flex justify-between items-center">
          <span class="text-slate-950 dark:text-white font-bold text-base">Total Estimado</span>
          <span class="text-slate-950 dark:text-white font-black text-xl" data-drawer-total>$0 COP</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-2.5 pt-1">
        <!-- Contenedor de feedback / error amigable -->
        <div data-checkout-feedback class="hidden p-3 rounded-xl bg-red-100 dark:bg-red-950/40 border border-red-300 dark:border-red-500/30 text-xs text-red-900 dark:text-red-200 flex flex-col gap-2">
          <div class="flex items-start gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 dark:text-red-400 flex-shrink-0 mt-0.5"></i>
            <span data-checkout-error-msg class="leading-tight"></span>
          </div>
          <!-- Fallback alternativo a WhatsApp si falla checkout -->
          <button type="button" data-checkout-fallback-wa
            class="hidden w-full py-1.5 px-3 rounded-lg bg-black/10 dark:bg-white/10 hover:bg-black/15 dark:hover:bg-white/15 text-slate-900 dark:text-white font-semibold text-[11px] text-center transition-colors">
            Completar pedido por WhatsApp
          </button>
        </div>

        <button type="button" data-checkout-btn
          class="w-full py-4 px-6 rounded-full bg-black hover:bg-neutral-800 text-white dark:bg-white dark:hover:bg-neutral-200 dark:text-black font-black text-sm uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-black/10 dark:shadow-white/10 hover:scale-[1.01] active:scale-[0.99] disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100 transition-all">
          <span data-checkout-spinner class="hidden w-4 h-4 border-2 border-white/30 border-t-white dark:border-black/30 dark:border-t-black rounded-full animate-spin"></span>
          <span data-checkout-text>Proceder al Pago</span>
          <i data-lucide="arrow-right" data-checkout-icon class="w-4 h-4"></i>
        </button>

        <!-- Botón secundario: Seguir comprando -->
        <button type="button" data-continue-shopping-btn
          class="w-full py-3.5 px-6 rounded-full border-2 border-slate-300 dark:border-white/20 text-slate-800 dark:text-white font-bold text-xs sm:text-sm uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 active:scale-[0.99] transition-all">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Seguir comprando</span>
        </button>

        <div class="flex justify-between items-center pt-1 px-1">
          <button type="button" data-clear-cart-btn
            class="text-[11px] uppercase tracking-wider text-slate-500 hover:text-red-600 dark:hover:text-red-400 transition-colors flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Vaciar carrito</span>
          </button>
          <span class="text-[11px] text-slate-500 dark:text-gray-500 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-neutral-400 inline-block"></span>
            Checkout oficial Shopify
          </span>
        </div>
      </div>
    </div>

  </div>
</aside>
<!-- END: Cart Drawer Component -->
