<!-- BEGIN: Customization Section -->
<section class="py-24 bg-brand-gray relative" id="colores">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div data-section-heading></div>
    <div class="grid grid-cols-1 md:grid-cols-[1fr_2fr_1fr] gap-10 md:gap-4 lg:gap-8 items-center" data-reveal>
      <!-- 1. Color Selection -->
      <div>
        <h3 class="text-lg font-bold text-center mb-8 uppercase tracking-wider text-brand-dark">1. Elige tu color</h3>
        <div class="grid grid-cols-3 gap-4 md:grid-cols-2 md:gap-3 lg:grid-cols-3 lg:gap-6" data-config-colores>
        </div>
      </div>
      <!-- Central Preview -->
      <div class="relative flex justify-center">
        <div class="config-preview relative w-[80%] lg:w-[78%]">
          <div class="config-glow" aria-hidden="true"></div>
          <div class="config-3d" data-config-3d data-lenis-prevent role="img"
            aria-label="Vista previa 3D de la camiseta Tambo Active">
            <div class="config-3d-loading" data-config-3d-loading aria-hidden="true">
              <div class="config-3d-spinner"></div>
              <span class="config-3d-loading-text"></span>
            </div>
          </div>
          <p class="mt-6 text-center text-xs text-gray-500 flex items-center justify-center gap-1">
            <span data-config-caption>Negro · Tambo Active</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </p>
          <div class="mt-6 flex justify-center" data-cta-configurator></div>
        </div>
      </div>
      <!-- 2. Logo Selection -->
      <div>
        <h3 class="text-lg font-bold text-center mb-8 uppercase tracking-wider text-brand-dark">2. Elige tu logo</h3>
        <div class="flex flex-wrap gap-4 md:flex-col md:gap-3 lg:gap-4" data-config-logos></div>
      </div>
    </div>
  </div>
</section>
<!-- END: Customization Section -->
